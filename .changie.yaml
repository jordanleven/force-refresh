changesDir: .changes
headerPath: .changes/header.md
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: "## {{.Version}} - {{.Time.Format \"2006-01-02\"}}"
kindFormat: "### {{.Kind}}"
changeFormat: "* {{.Body}}"
kinds:
  - label: Feature (major)
    auto: major
    # Feature notes keep their What's New icon in an HTML comment, which the
    # WordPress.org readme parser strips before display.
    changeFormat: &featureChangeFormat "* {{.Body}}{{if and .Custom.Icon (ne .Custom.Icon \"none\")}} <!-- icon: {{.Custom.Icon}} -->{{end}}"
    additionalChoices: &featureChoices
      - key: Icon
        label: What's New icon
        type: enum
        optional: true
        # The prompt always requires a choice, so "none" keeps the default icon.
        enumOptions:
          - none
          - bell
          - bolt
          - calendar
          - clock-outline
          - gauge
          - gear
          - gift
          - palette
          - refresh
          - shield
          - sliders
          - star
  - label: Feature (minor)
    auto: minor
    changeFormat: *featureChangeFormat
    additionalChoices: *featureChoices
  - label: Changed (major)
    auto: major
  - label: Changed (minor)
    auto: minor
  - label: Bug fix
    auto: patch
  - label: Dependencies & security
    auto: patch
    skipBody: true
    changeFormat: "* Performance enhancements and bug fixes."
