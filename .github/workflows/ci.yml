name: CI
on:
  push:
    branches:
      - master
      - release--*
    tags:
      - "!v[0-9]+.[0-9]+.[0-9]+"
      - "!v[0-9]+.[0-9]+.[0-9]+-"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - release--*

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-commit-message:
    name: Check Commit Message
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Proofread commit types
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git log ${BASE_SHA}..HEAD --no-merges --format='%s' | while IFS= read -r subject; do
            if ! echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|test|chore).+'; then
              echo "Invalid commit message: $subject"
              echo "Commit messages must begin with a valid commit type."
              exit 1
            fi
          done

  set-variables:
    name: Set Variables
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      node-version: ${{ steps.nvm.outputs.NVMRC }}
      php-version: ${{ steps.php.outputs.PHP_VERSION }}
      release-version: ${{ steps.release-version.outputs.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@v6

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm

      - name: Get PHP version
        run: echo "PHP_VERSION=8.4" >> $GITHUB_OUTPUT
        id: php

      - name: Set release version
        run: echo "RELEASE_VERSION=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT
        id: release-version

  check-changelog-fragment:
    name: Check Changelog Fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changed application files
        id: app-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            includes/**
            src/**
            filter-force-refresh.php

      - name: Check for new changie fragments
        id: changie-fragments
        uses: tj-actions/changed-files@v46
        with:
          files: .changes/unreleased/*.yaml

      - name: Manage changelog fragment comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- force-refresh-changelog-check -->';
            const needsFragment =
              '${{ steps.app-files.outputs.any_changed }}' === 'true' &&
              '${{ steps.changie-fragments.outputs.any_changed }}' !== 'true';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (needsFragment) {
              const files = '${{ steps.app-files.outputs.all_changed_files }}'
                .split(' ')
                .map(f => `- \`${f}\``)
                .join('\n');
              const body = [
                marker,
                'This PR modifies application code but does not include a changelog fragment. If this change is user-facing, run `npm run changelog:new` to add one before merging.',
                '',
                '**Modified application files:**',
                files,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

  check-beta-release:
    name: Check Beta Release
    runs-on: ubuntu-latest
    needs: set-variables

    steps:
      - name: Verify version is not a beta release
        run: |
          version="${{ needs.set-variables.outputs.release-version }}"
          if echo "$version" | grep -q "-"; then
            echo "::error::Version $version is a beta release and cannot be merged into this branch."
            exit 1
          fi

  install-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.set-variables.outputs.php-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install

      - name: Save to cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: 'javascript'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      env:
        CODEQL_ACTION_FILE_COVERAGE_ON_PRS: true

  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
        - install-dependencies
        - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

      - name: Lint JavaScript source code
        run: npm run lint

      - name: Lint PHP source code
        run: composer lint

  testing-javascript:
    name: Testing – JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

      - name: Test JavaScript source code
        run: npm test
        env:
          TZ: America/New_York

  testing-php:
    name: Testing – PHP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.set-variables.outputs.php-version }}
          coverage: xdebug

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

      - name: Test PHP source code
        run: composer test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jordanleven/force-refresh
          files: ./coverage/coverage.xml

  building:
    name: Building
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

      - name: Build JavaScript artifact
        run: npm run build

      - name: Upload JavaScript build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  detect-e2e-changes:
    name: Detect E2E Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Anything outside this ignore list (package/composer manifests and
      # lockfiles, src/, includes/, build config, docker-compose, workflows,
      # tests, ...) can affect the plugin, so it runs the e2e suite.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              # README.md and CHANGELOG.md are not ignored: they generate
              # README.txt, which feeds the release notes modal.
              - '!CONTRIBUTING.md'
              - '!docker/README.md'
              - '!.github/*.md'
              - '!docs/**'
              - '!.changes/**'
              - '!.changie.yaml'
              - '!screenshots/**'
              - '!.wordpress-org/**'
              - '!LICENSE*'
              - '!.github/CODEOWNERS'
              - '!.github/dependabot.yml'
              - '!.github/workflows/release-*.yml'
              - '!.github/workflows/label-dependabot.yml'

  testing-e2e:
    name: Testing – E2E
    # Pinned: ubuntu-latest moved to 26.04 (Docker 29), which the pinned
    # Traefik v2.1.3 in docker-compose.yml can't route through. Unpin once
    # Traefik is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Uses no secrets so it runs on Dependabot and fork PRs.
    permissions:
      contents: read
    # Runs on ready (non-draft) PRs and on pushes to release--* branches.
    # Pushes to master are skipped: branch protection requires PRs to be up
    # to date, so the PR run already covered the merged code. A skipped job
    # reports success, so this still works as a required check.
    if: >-
      needs.detect-e2e-changes.outputs.e2e == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft != true) ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release--'))
      )
    needs:
      - set-variables
      - install-dependencies
      - detect-e2e-changes
      - linting
      - testing-javascript
      - testing-php
      - building

    steps:
      # Full history and tags are needed to generate README.txt.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.sha }}

      - name: Download JavaScript build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # README.txt is gitignored; the release notes modal reads it.
      - name: Generate WordPress README
        run: npm run changelog:build

      - name: Add WordPress hostnames
        run: echo "127.0.0.1 wp5.force-refresh.localhost wp6.force-refresh.localhost wp7.force-refresh.localhost" | sudo tee -a /etc/hosts

      - name: Start WordPress instances
        run: docker compose up -d --wait wordpress-wp5 wordpress-wp6 wordpress-wp7

      - name: Get Playwright version
        id: playwright
        run: echo "VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Collect WordPress logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log 2>&1 || true

      - name: Upload e2e test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
            docker-compose.log
          retention-days: 14
          if-no-files-found: ignore
