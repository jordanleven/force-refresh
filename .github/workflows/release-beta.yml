name: Release Beta Build
run-name: Beta release for PR #${{ inputs.pr }}
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: release-beta-${{ inputs.pr }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  PR_NUMBER: ${{ inputs.pr }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  set-variables:
    name: Set Variables
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      node-version: ${{ steps.nvm.outputs.NVMRC }}
      php-version: ${{ steps.php.outputs.PHP_VERSION }}
      head-sha: ${{ steps.pull-request.outputs.HEAD_SHA }}

    steps:
      - name: Resolve pull request head
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r state head_sha head_repo <<< "$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha, (.head.repo.full_name // "deleted")] | @tsv')"
          if [ "$state" != "open" ]; then
            echo "::error::PR #${PR_NUMBER} is ${state:-missing}. Betas can only be built from open pull requests."
            exit 1
          fi
          if [ "$head_repo" != "$GH_REPO" ]; then
            echo "::error::PR #${PR_NUMBER} comes from ${head_repo}, not ${GH_REPO}. Betas can only be built from pull requests opened from a branch of this repository."
            exit 1
          fi
          echo "HEAD_SHA=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Mark beta release as pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull-request.outputs.HEAD_SHA }}
        run: |
          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="Beta Release" \
            -f description="Building a beta release." \
            -f target_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pull-request.outputs.HEAD_SHA }}
          persist-credentials: false

      - name: Get node version
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Get PHP version
        run: echo "PHP_VERSION=8.4" >> "$GITHUB_OUTPUT"
        id: php

  install-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: set-variables
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      # Includes the attempt so a re-run saves fresh caches. Jobs read the key
      # from this output, so re-running only failed jobs still finds it.
      cache-key: dependencies-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.head-sha }}
          persist-credentials: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.set-variables.outputs.php-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install

      - name: Compute beta version
        id: version
        run: |
          version=$(.github/scripts/getBetaVersion.sh "$PR_NUMBER" "$GITHUB_RUN_NUMBER")
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Save to Cache
        uses: actions/cache/save@v5
        with:
          path: |
            vendor
            node_modules
          key: dependencies-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.head-sha }}
          persist-credentials: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          path: |
            vendor
            node_modules
          key: ${{ needs.install-dependencies.outputs.cache-key }}

      - name: Lint JavaScript source code
        run: npm run lint

      - name: Lint PHP source code
        run: composer lint

  testing-javascript:
    name: Testing – JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.head-sha }}
          persist-credentials: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          path: |
            vendor
            node_modules
          key: ${{ needs.install-dependencies.outputs.cache-key }}

      - name: Test JavaScript source code
        run: npm test
        env:
          TZ: America/New_York

  testing-php:
    name: Testing – PHP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - install-dependencies
      - set-variables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.head-sha }}
          persist-credentials: false

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.set-variables.outputs.php-version }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          path: |
            vendor
            node_modules
          key: ${{ needs.install-dependencies.outputs.cache-key }}

      - name: Test PHP source code
        run: composer test

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
      - set-variables
    outputs:
      cache-key: build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.set-variables.outputs.head-sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Pull dependencies from cache
      uses: actions/cache@v5
      with:
        fail-on-cache-miss: true
        path: |
          vendor
          node_modules
        key: ${{ needs.install-dependencies.outputs.cache-key }}

    - name: Set node version
      uses: actions/setup-node@v6
      with:
        node-version: ${{ needs.set-variables.outputs.node-version }}

    - name: Set beta version
      env:
        VERSION: ${{ needs.install-dependencies.outputs.version }}
      run: .github/scripts/setBuildVersion.sh "$VERSION"

    - name: Build JavaScript artifact
      run: npm run build

    - name: Create release notes
      run: |
        node .github/scripts/dedupeUnreleasedDependencyFragments.js
        NEXT_VERSION=$(npx changie next auto 2>/dev/null) || NEXT_VERSION="unreleased"
        cp CHANGELOG.md CHANGELOG.md.bak
        npx changie batch "$NEXT_VERSION" 2>/dev/null || true
        if [ -f ".changes/${NEXT_VERSION}.md" ]; then
          {
            head -n 4 CHANGELOG.md
            cat ".changes/${NEXT_VERSION}.md"
            printf "\n"
            tail -n +5 CHANGELOG.md
          } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          cp ".changes/${NEXT_VERSION}.md" release-notes.md
        fi
        npm run changelog:build
        mv CHANGELOG.md.bak CHANGELOG.md
        rm -f ".changes/${NEXT_VERSION}.md"

    - name: Prune Composer dependencies
      run: composer install --no-dev --no-scripts

    - name: Prune JavaScript dependencies
      run: npm prune --production

    - name: Copy beta release notice
      run: cp docs/Beta-Releases.md ./

    - name: Find files not included in distignore
      id: dist-files
      run: echo "DIST_FILES=$(find . -type f | grep -v -E -f .distignore | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

    - name: Build plugin artifact
      uses: vimtor/action-zip@v1.3
      with:
        files: ${{ steps.dist-files.outputs.DIST_FILES }}
        recursive: false
        dest: ./Force-Refresh-${{ needs.install-dependencies.outputs.version }}.zip

    - name: Save build to cache
      uses: actions/cache/save@v5
      with:
        path: '**/'
        key: build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The release job gets only the zip and release notes, never the rest of
    # the workspace this PR's code built.
    - name: Upload release files
      uses: actions/upload-artifact@v7
      with:
        name: beta-release
        path: |
          Force-Refresh-${{ needs.install-dependencies.outputs.version }}.zip
          release-notes.md
        if-no-files-found: error
        retention-days: 7

  testing-e2e:
    name: Testing – E2E
    # Pinned: ubuntu-latest moved to 26.04 (Docker 29), which the pinned
    # Traefik v2.1.3 in docker-compose.yml can't route through. Unpin once
    # Traefik is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - install-dependencies
      - set-variables
      - linting
      - testing-javascript
      - testing-php
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.head-sha }}
          persist-credentials: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.set-variables.outputs.node-version }}

      - name: Pull build artifact from cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          path: '**/'
          key: ${{ needs.build.outputs.cache-key }}

      - name: Pull dependencies from cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          path: |
            vendor
            node_modules
          key: ${{ needs.install-dependencies.outputs.cache-key }}

      - name: Add WordPress hostnames
        run: echo "127.0.0.1 wp5.force-refresh.localhost wp6.force-refresh.localhost wp7.force-refresh.localhost" | sudo tee -a /etc/hosts

      - name: Start WordPress instances
        run: docker compose up -d --wait

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

  # Kept out of the release job because it runs on the workspace this PR's
  # code built, so it gets no secrets and only a read token.
  wordpress-dry-run:
    name: Simulate WordPress.org Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install-dependencies
      - set-variables
      - build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.set-variables.outputs.head-sha }}
        persist-credentials: false

    - name: Pull build from cache
      uses: actions/cache@v5
      with:
        fail-on-cache-miss: true
        path: '**/'
        key: ${{ needs.build.outputs.cache-key }}

    # A dry run checks out SVN anonymously and never commits. The action only
    # requires the credentials to be non-empty, so no secrets are passed.
    - name: Simulate deploy to WordPress.org
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        dry-run: true
      env:
        ASSETS_DIR: .wordpress-org
        SVN_PASSWORD: dry-run
        SVN_USERNAME: dry-run
        SLUG: force-refresh
        VERSION: ${{ needs.install-dependencies.outputs.version }}

  # Holds a write token, so it runs scripts only from the workflow's own commit
  # and reads the PR's checkout as data (git history), never as code.
  release:
    name: Release Beta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    needs:
      - set-variables
      - install-dependencies
      - linting
      - testing-javascript
      - testing-php
      - build
      - testing-e2e
      - wordpress-dry-run
    env:
      HEAD_SHA: ${{ needs.set-variables.outputs.head-sha }}
      VERSION: ${{ needs.install-dependencies.outputs.version }}

    steps:
    - name: Checkout release scripts
      uses: actions/checkout@v6
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
        persist-credentials: false

    - name: Checkout pull request history
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.set-variables.outputs.head-sha }}
        path: pull-request
        fetch-depth: 0
        persist-credentials: false

    - name: Get commits since last stable release
      id: changes
      working-directory: pull-request
      run: |
        PREV_STABLE_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
        bash ../trusted/.github/scripts/getCommitsSinceRelease.sh "$PREV_STABLE_TAG"

    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: beta-release
        path: dist

    - name: Create GitHub release
      env:
        COMMITS: ${{ steps.changes.outputs.COMMITS }}
        GH_TOKEN: ${{ github.token }}
      run: |
        asset="force-refresh-$(echo "$VERSION" | tr '.' '-').zip"
        cp "dist/Force-Refresh-${VERSION}.zip" "$asset"
        {
          echo "This is a beta release of Force Refresh (v${VERSION}) built from #${PR_NUMBER} at ${HEAD_SHA}."
          echo "This release is intended to be used for debugging and **should not** be used on production sites unless directed."
          echo "Production-stable versions are available at https://wordpress.org/plugins/force-refresh."
          printf "\n## Upcoming Release Notes\n\n"
          if [ -s dist/release-notes.md ]; then
            cat dist/release-notes.md
          else
            echo "There are no unreleased notes for this pull request."
          fi
          printf "\n## Commits Since Last Release\n\n%s\n" "$COMMITS"
        } > release-body.md
        gh release create "v${VERSION}" "$asset" \
          --target "$HEAD_SHA" \
          --prerelease \
          --title "Force Refresh ${VERSION}" \
          --notes-file release-body.md

    # Runs after the new beta exists, so a failed create never leaves the PR
    # without one.
    - name: Delete earlier betas for this PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: trusted/.github/scripts/deleteBetaReleases.sh "$PR_NUMBER" "v${VERSION}"

    - name: Comment on PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        release_url=$(gh release view "v${VERSION}" --json url --jq '.url')
        asset_url=$(gh release view "v${VERSION}" --json assets --jq '.assets[0].url')
        gh pr comment "$PR_NUMBER" --body "Build ${VERSION} is [available for download](${asset_url}) under [Releases](${release_url})."

  report-status:
    name: Report Beta Release Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always() && needs.set-variables.outputs.head-sha != ''
    permissions:
      statuses: write
    needs:
      - set-variables
      - install-dependencies
      - linting
      - testing-javascript
      - testing-php
      - build
      - testing-e2e
      - wordpress-dry-run
      - release

    steps:
      - name: Set Beta Release status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.set-variables.outputs.head-sha }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          VERSION: ${{ needs.install-dependencies.outputs.version }}
        run: |
          state=success
          description="Beta ${VERSION} was released."
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              state=failure
              description="The beta release did not complete."
            fi
          done
          echo "Job results: ${RESULTS}"
          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="Beta Release" \
            -f description="$description" \
            -f target_url="$RUN_URL" >/dev/null
